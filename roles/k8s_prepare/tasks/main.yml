---
- name: Disable swap memory space immediately
  ansible.builtin.command: swapoff -a
  when: ansible_facts["swaptotal_mb"] > 0
  changed_when: true

- name: Disable swap mapping permanently inside /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+.*)$'
    replace: '# \1'

- name: Load infrastructure kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ kernel_modules }}"

- name: Ensure kernel modules persist across node reboots
  ansible.builtin.copy:
    dest: "{{ modules_config_file }}"
    content: |
      {% for module in kernel_modules %}
      {{ module }}
      {% endfor %}
    mode: '0644'

- name: Configure Linux kernel network bridge sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ sysctl_config_file }}"
    state: present
    reload: true
  loop: "{{ sysctl_settings }}"

- name: Install underlying containerd application engine
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true

- name: Verify containerd operating configuration directory exists
  ansible.builtin.file:
    path: "{{ containerd_config_dir }}"
    state: directory
    mode: '0755'

- name: Generate production default containerd configuration profile
  ansible.builtin.shell: containerd config default > {{ containerd_config_dir }}/config.toml
  args:
    creates: "{{ containerd_config_dir }}/config.toml"

- name: Enforce SystemdCgroup execution layer inside containerd profile
  ansible.builtin.lineinfile:
    path: "{{ containerd_config_dir }}/config.toml"
    regexp: 'SystemdCgroup = false'
    line: '            SystemdCgroup = true'
  notify: Restart Containerd

- name: Add Kubernetes APT repository using modern Deb822 format
  ansible.builtin.deb822_repository:
    name: kubernetes
    state: present
    types: [deb]
    uris: "https://pkgs.k8s.io/core:/stable:/v1.30/deb/"
    suites: [/]
    signed_by: "https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key"

- name: Install Kubernetes administration tools
  ansible.builtin.apt:
    name: [ 'kubelet', 'kubeadm', 'kubectl' ]
    state: present
    update_cache: yes

- name: Hold Kubernetes packages at current version to prevent accidental updates
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [ 'kubelet', 'kubeadm', 'kubectl' ]
