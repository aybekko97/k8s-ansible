---
- name: Execute Enterprise Cluster Provisioning Sequence
  hosts: masters
  become: true
  gather_facts: true

  roles:
    - k8s_prepare
  tags:
    - prepare

- name: Run Orchestrated High-Availability Control Plane Bootstrapping
  hosts: masters
  become: true
  gather_facts: true

  roles:
    - k8s_init
  tags:
    - init

- ---
- name: Emergency SSH Public Key Injection Pipeline
  # 🎯 Explicitly list your target IP addresses here
  hosts: masters
  gather_facts: false # ⚡ Speed up execution by bypassing system fact collection
  become: yes          # Escalate to root to write securely to authorized_keys

  tasks:
    - name: Inject administrator personal public key into user space
      ansible.builtin.authorized_key:
        user: ubuntu
        state: present
        # Reads the local key file directly off your ops-box disk cleanly
        key: "ssh-rsa  aibek@MacBook-Pro-Aibek.local"
  tags:
    - emergency